name: Build

on:
  # Branches are built through their pull request; building their pushes too
  # would run the whole matrix twice.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Find packages
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v7

      # Every <category>/<package>/Makefile in the feed. Naming the packages
      # makes gh-action-sdk run its per-package checks (download, hash,
      # patch refresh, shfmt on init scripts) rather than a bare build.
      - id: find
        run: |
          list=$(find . -mindepth 3 -maxdepth 3 -name Makefile -not -path './.github/*' \
            -printf '%h\n' | xargs -r -n1 basename | sort | tr '\n' ' ')
          list=${list% }
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Packages: ${list:-none}"

  build:
    name: ${{ matrix.target }} ${{ matrix.release }}
    needs: packages
    if: needs.packages.outputs.list != ''
    runs-on: ubuntu-latest
    # Snapshot is what an openwrt/packages PR builds against; report it,
    # but don't let a broken snapshot SDK fail the run.
    continue-on-error: ${{ matrix.release == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        release:
          - 25.12.5
          - main
        target:
          - ramips-mt7621     # mipsel_24kc: little-endian, soft-float (test hardware)
          - ath79-generic     # mips_24kc: big-endian, where the package is not offered
          - mediatek-filogic  # aarch64_cortex-a53
          - x86-64            # x86_64
        # The runtime test needs an openwrt/rootfs image whose feeds resolve
        # alsa-lib's kmod-sound-core. x86_64 has one for both releases, and it
        # is one of the images openwrt/packages runs its own test on.
        include:
          - target: x86-64
            release: 25.12.5
            rootfs: x86_64-25.12.5
          - target: x86-64
            release: main
            rootfs: x86_64-master
    steps:
      - uses: actions/checkout@v7

      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.target }}-${{ matrix.release }}
          FEEDNAME: sendspin
          INDEX: 1
          PACKAGES: ${{ needs.packages.outputs.list }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.target }}-${{ matrix.release }}
          path: |
            bin/packages/*/sendspin/*.apk
            bin/packages/*/sendspin/packages.adb
            logs/
          if-no-files-found: warn

      # The same runtime tests openwrt/packages runs on pull requests: install
      # the package in an OpenWrt root filesystem, check its executables
      # (version, stripping, linked libraries), then run the package's test.sh.
      - name: Checkout OpenWrt runtime test scripts
        if: matrix.rootfs
        uses: actions/checkout@v7
        with:
          repository: openwrt/actions-shared-workflows
          path: openwrt-tests
          sparse-checkout: |
            .github/scripts/ci_helpers.sh
            .github/scripts/test_entrypoint.sh
            .github/scripts/sysctl.init
          sparse-checkout-cone-mode: false

      # As openwrt/packages does: docker/setup-qemu-action's binfmt image has
      # no 32-bit MIPS emulation, Ubuntu's qemu-user-static does.
      - name: Register QEMU
        if: matrix.rootfs
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --import

      - name: Runtime test in an OpenWrt container
        if: matrix.rootfs
        env:
          ROOTFS: ${{ matrix.rootfs }}
        run: |
          mkdir ci
          cp bin/packages/*/sendspin/*.apk bin/packages/*/sendspin/packages.adb ci/
          # test_entrypoint.sh finds test.sh from the package origin, e.g. sound/sendspin-cli
          cp -r sound ci/
          docker run --rm \
            --platform "linux/${ROOTFS%-*}" \
            -e ENABLE_GENERIC_TESTS=true \
            -e FORCE_GENERIC_TESTS=true \
            -e PKG_MANAGER=apk \
            -v "$PWD/openwrt-tests/.github/scripts:/scripts:ro" \
            -v "$PWD/openwrt-tests/.github/scripts/sysctl.init:/etc/init.d/sysctl:ro" \
            -v "$PWD/ci:/ci" \
            "openwrt/rootfs:$ROOTFS" \
            /scripts/test_entrypoint.sh
